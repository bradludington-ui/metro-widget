<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive to the Pentagon</title>
<meta name="theme-color" content="#12140F">
<style>
  :root{
    --bg:#12140F;            /* asphalt at dusk */
    --panel:#1B1E17;
    --edge:#2C3126;
    --sign:#1E7A3C;          /* interstate guide-sign green */
    --amber:#E8A317;         /* VDOT variable message board */
    --red:#E0432C;
    --ink:#EDEAE2;
    --mute:#8C8B7E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font:400 14px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
  #app{width:100%;max-width:440px;display:flex;flex-direction:column;min-height:100%}

  header{padding:14px 16px 12px;border-bottom:1px solid var(--edge);
    display:flex;align-items:center;gap:10px}
  .shield{width:30px;height:34px;flex:0 0 auto;border-radius:3px 3px 9px 9px;
    background:linear-gradient(180deg,#2F5FA8 0 55%,#B9302B 55% 100%);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;
    letter-spacing:-.5px;padding-top:6px}
  .hd{flex:1;min-width:0}
  .hd b{display:block;font-size:14px;font-weight:600}
  .hd span{display:block;font-size:11px;color:var(--mute);margin-top:1px}
  #gear{background:none;border:0;color:var(--mute);font-size:17px;cursor:pointer;padding:4px}

  .hero{padding:20px 16px 18px;border-bottom:1px solid var(--edge)}
  .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--mute)}
  .time{display:flex;align-items:baseline;gap:9px;margin-top:3px}
  .time em{font-style:normal;font-size:64px;line-height:.9;font-weight:700;
    letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .time small{font-size:13px;color:var(--mute)}
  .verdict{margin-top:9px;font-size:13.5px;font-weight:600}
  .good{color:#5FD08A} .mid{color:var(--amber)} .bad{color:var(--red)}
  .arrive{margin-top:3px;font-size:12px;color:var(--mute)}

  section{padding:14px 16px;border-bottom:1px solid var(--edge)}
  h2{font-size:10px;letter-spacing:.18em;color:var(--mute);font-weight:600;margin-bottom:9px}

  .opt{display:flex;align-items:baseline;gap:10px;padding:9px 11px;border-radius:5px;
    background:var(--panel);border:1px solid var(--edge);margin-bottom:7px}
  .opt.pick{border-color:var(--sign);background:#16261A}
  .opt b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
  .opt .lbl{flex:1;font-size:12.5px}
  .opt .lbl span{display:block;color:var(--mute);font-size:11px;margin-top:1px}
  .tag{font-size:9.5px;letter-spacing:.1em;color:var(--sign);border:1px solid var(--sign);
    border-radius:3px;padding:2px 5px;white-space:nowrap}

  .inc{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
  .inc:first-of-type{border-top:0}
  .icon{width:24px;height:24px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:#3A2A12;color:var(--amber)}
  .icon.crash{background:#3A1712;color:var(--red)}
  .inc .body{flex:1;min-width:0}
  .inc b{display:block;font-size:12.5px;font-weight:600}
  .inc span{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
  .inc .cost{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
  .clear{color:#5FD08A;font-size:12.5px}
  .slowrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge)}
  .slowrow:first-child{border-top:0}
  .slowrow b{flex:1;font-size:13px;font-weight:600}
  .bar{width:64px;height:6px;border-radius:3px;background:#2C3126;overflow:hidden;flex:0 0 auto}
  .bar i{display:block;height:100%;background:var(--amber)}
  .bar i.hot{background:var(--red)}
  .slowrow .cost{font-size:12px;font-weight:700;color:var(--amber);min-width:34px;text-align:right}
  .prov{font-size:10px;color:var(--mute);letter-spacing:.04em}

  footer{padding:12px 16px;display:flex;align-items:center;gap:9px;margin-top:auto}
  button.act{font:600 12.5px/1 inherit;color:var(--ink);background:#2A2F24;
    border:1px solid var(--edge);border-radius:4px;padding:9px 13px;cursor:pointer}
  button.act:hover{background:#343A2C}
  .stamp{margin-left:auto;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}

  .note{padding:14px 16px;font-size:12.5px;color:var(--mute);line-height:1.6}
  .note code{background:var(--panel);padding:1px 5px;border-radius:3px;color:var(--amber)}
  #setup{display:none;padding:14px 16px;border-bottom:1px solid var(--edge)}
  #setup.open{display:block}
  #setup label{display:block;font-size:11.5px;color:var(--mute);margin:9px 0 3px}
  #setup input{width:100%;background:#0E100C;color:var(--ink);border:1px solid var(--edge);
    border-radius:4px;padding:8px 9px;font:400 12.5px/1 monospace}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="shield" aria-hidden="true">95</div>
    <div class="hd">
      <b id="route">Lorton → The Pentagon</b>
      <span id="sub">Tap Refresh for current conditions</span>
    </div>
    <button id="gear" aria-label="Settings">⚙</button>
  </header>

  <div id="setup">
    <label for="oLat">Start (paste lat, lon from Google Maps)</label>
    <input id="oLat" placeholder="38.7057, -77.2247">
    <label for="dLat">Destination</label>
    <input id="dLat" placeholder="38.8719, -77.0563">
    <label for="arriveBy">Need to be there by (optional, HH:MM)</label>
    <input id="arriveBy" placeholder="07:30">
    <button class="act" id="saveCfg" style="margin-top:11px;width:100%">Save</button>
  </div>

  <div class="hero">
    <div class="eyebrow" id="eyebrow">DOOR TO DOOR</div>
    <div class="time"><em id="mins">—</em><small id="unit"></small></div>
    <div class="verdict" id="verdict">Not checked yet</div>
    <div class="arrive" id="arrive"></div>
  </div>

  <section id="optsWrap">
    <h2>ROUTE</h2>
    <div id="opts"></div>
  </section>

  <section id="slowWrap" style="display:none">
    <h2>WHERE IT'S SLOW</h2>
    <div id="slow"></div>
  </section>

  <section>
    <h2 id="incHead">INCIDENTS</h2>
    <div id="incidents"><span class="clear">—</span></div>
  </section>

  <div class="note" id="note" style="display:none"></div>

  <footer>
    <button class="act" id="refresh">Refresh</button>
    <button class="act" id="auto">Auto: off</button>
    <span class="stamp" id="stamp"></span>
  </footer>
</div>

<script>
const CFG = Object.assign({
  from:"38.7057,-77.2247",     // I-95 Exit 163 at Lorton Road — change to her driveway
  to:"38.8719,-77.0563",       // The Pentagon
  arriveBy:""
}, load());

function load(){ try{ return JSON.parse(localStorage.getItem("drive-cfg")||"{}"); }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem("drive-cfg", JSON.stringify(CFG)); }catch(e){} }

const $ = id => document.getElementById(id);
let timer = null, autoOn = false;

const mmss = s => Math.round(s/60);
const clock = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

async function refresh(){
  $("sub").textContent = "Checking…";
  try{
    const r = await fetch("/api/traffic?from=" + encodeURIComponent(CFG.from) +
                          "&to=" + encodeURIComponent(CFG.to), {cache:"no-store"});
    const j = await r.json();
    if(j.error === "no_key"){ needKey(j.message); return; }
    if(j.error){ showError(j); return; }
    paint(j);
  }catch(e){
    showError({ error: e.message });
  }
}

// HERE's 400s name the offending parameter, so show them rather than
// collapsing everything into "something went wrong".
function showError(j){
  $("sub").textContent = "HERE request failed";
  $("verdict").textContent = "Traffic unavailable";
  $("verdict").className = "verdict bad";
  $("mins").textContent = "—"; $("unit").textContent = "";
  $("arrive").textContent = "";
  $("opts").innerHTML = ""; $("slowWrap").style.display = "none";
  $("incidents").innerHTML = "";
  $("note").style.display = "";
  let html = "<b>" + escapeHtml(j.error || "Unknown error") + "</b>";
  if(j.attempts && j.attempts.length){
    html += "<br><br>Requests attempted:<br>" + j.attempts.map(a =>
      "<code>" + escapeHtml(a.tier) + "</code> → " +
      escapeHtml(String(a.status || a.error || "")) +
      (a.body ? "<br><span style='font-size:11px'>" + escapeHtml(a.body) + "</span>" : "")
    ).join("<br>");
  }
  html += "<br><br>Full detail at <code>/api/traffic/debug</code>";
  $("note").innerHTML = html;
}
const escapeHtml = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function needKey(msg){
  $("note").style.display = "";
  $("note").innerHTML = "<b>No traffic key set.</b><br>" + msg +
    "<br><br>Add it as a secret named <code>HERE_KEY</code> in the Cloudflare " +
    "dashboard under Settings → Variables and Secrets, then redeploy.";
  $("sub").textContent = "Needs a HERE key";
  $("verdict").textContent = "Not configured";
  $("verdict").className = "verdict mid";
}

function paint(j){
  const best = j.routes && j.routes[0];
  if(!best){ $("verdict").textContent = "No route returned"; return; }

  const mins = mmss(best.seconds);
  const delay = mmss(best.delaySeconds || 0);
  // Prefer typical conditions for this time of day when HERE supplies them
  // (typicalDuration spans); free-flow at 3am isn't a fair yardstick.
  const baseline = best.typicalSeconds || best.freeFlowSeconds;
  const vsTypical = baseline ? mmss(best.seconds - baseline) : null;

  $("mins").textContent = mins;
  $("unit").textContent = "min";
  $("eyebrow").textContent = "DOOR TO DOOR · " + (best.meters/1609).toFixed(1) + " mi";

  let cls = "good", verdict;
  if(best.typicalSeconds){
    // Compared against typical conditions for this time of day — the fair
    // yardstick, and the one that stays quiet on an ordinary rush hour.
    if(vsTypical >= 12){ cls = "bad";  verdict = vsTypical + " min worse than a normal day"; }
    else if(vsTypical >= 5){ cls = "mid"; verdict = vsTypical + " min worse than usual"; }
    else if(vsTypical <= -4){ verdict = Math.abs(vsTypical) + " min better than usual"; }
    else { verdict = "About normal for this time"; }
  } else {
    // Only a free-flow baseline available. Rush hour always looks terrible
    // against an empty road, so the thresholds are higher and the wording
    // says what it's actually measuring rather than implying it's unusual.
    if(delay >= 25){ cls = "bad"; verdict = "Heavy — " + delay + " min over an empty road"; }
    else if(delay >= 12){ cls = "mid"; verdict = "Busy — " + delay + " min over an empty road"; }
    else if(delay >= 4){ verdict = "Light traffic, " + delay + " min of delay"; }
    else { verdict = "Running clear"; }
  }
  $("verdict").textContent = verdict;
  $("verdict").className = "verdict " + cls;

  const eta = Date.now() + best.seconds*1000;
  let arrive = "Leave now, arrive around " + clock(eta) + ".";
  if(CFG.arriveBy){
    const [h,m] = CFG.arriveBy.split(":").map(Number);
    const target = new Date(); target.setHours(h, m, 0, 0);
    const leaveBy = target.getTime() - best.seconds*1000;
    const slack = Math.round((leaveBy - Date.now())/60000);
    arrive = slack >= 0
      ? "To be there by " + clock(target) + ", leave by " + clock(leaveBy) +
        " — that's " + slack + " min from now."
      : "To be there by " + clock(target) + " you needed to leave " +
        Math.abs(slack) + " min ago.";
  }
  $("arrive").textContent = arrive;

  // Route options
  const rows = [];
  rows.push({ mins, label:"Fastest route now",
              note: best.jamCount ? best.jamCount + " slow stretch" + (best.jamCount>1?"es":"") + " en route" : "Flowing freely",
              pick:true, tag:null });
  if(j.tollFree){
    const tf = mmss(j.tollFree.seconds);
    const diff = tf - mins;
    rows.push({ mins:tf, label:"Without tolls",
                note: diff <= 0 ? "Same or better, no toll"
                    : diff + " min slower — that's what the Express Lanes are buying",
                pick:false, tag: diff > 0 ? null : "FREE" });
  }
  if(j.routes && j.routes[1]){
    const alt = mmss(j.routes[1].seconds);
    rows.push({ mins:alt, label:"Alternate route", note:(alt-mins) + " min slower", pick:false });
  }
  $("opts").innerHTML = rows.map(r =>
    '<div class="opt' + (r.pick?" pick":"") + '"><b>' + r.mins + '</b>' +
    '<span class="lbl">' + r.label + '<span>' + r.note + '</span></span>' +
    (r.tag ? '<span class="tag">' + r.tag + '</span>' : '') + '</div>').join("");

  // Incidents
  const inc = j.incidents || [];
  $("incidents").innerHTML = inc.length ? inc.map(i => {
    const crash = i.kind === "Accident";
    const where = [i.road, i.from && ("near " + i.from)].filter(Boolean).join(" · ");
    const cost = i.delaySec > 60 ? "+" + Math.round(i.delaySec/60) + "m"
               : (i.criticality >= 3 ? "major" : i.criticality === 2 ? "moderate" : "");
    return '<div class="inc"><div class="icon' + (crash?" crash":"") + '">' +
      (crash ? "!" : "▲") + '</div><div class="body"><b>' +
      (i.description || i.kind) + '</b><span>' + (where || i.kind) + '</span></div>' +
      '<span class="cost">' + cost + '</span></div>';
  }).join("") : '<span class="clear">Nothing reported on her route.</span>';

  // Named slow stretches, from the route's per-span road names
  const slow = j.slow || [];
  $("slowWrap").style.display = slow.length ? "" : "none";
  if(slow.length){
    $("slow").innerHTML = slow.map(x=>{
      const pct = Math.min(100, (x.jamFactor||0)*10);
      return '<div class="slowrow"><b>' + x.road + '</b>' +
        '<span class="bar"><i class="' + (pct>60?"hot":"") + '" style="width:' + pct + '%"></i></span>' +
        '<span class="cost">+' + Math.max(1, Math.round(x.delaySec/60)) + 'm</span></div>';
    }).join("");
  }

  // Say plainly when incidents are merely nearby rather than on the route.
  $("incHead").textContent = "INCIDENTS ON HER ROUTE";

  $("sub").textContent = "Lorton → Pentagon · HERE" +
    (j.degraded ? " (" + j.degraded + ")" : "");
  $("stamp").textContent = "Updated " + clock(Date.now());
}

$("refresh").onclick = refresh;
$("auto").onclick = ()=>{
  autoOn = !autoOn;
  $("auto").textContent = "Auto: " + (autoOn ? "on" : "off");
  clearInterval(timer);
  // Every 3 minutes is plenty for a 30-minute drive, and keeps a day's
  // use to a couple of hundred calls against a 2,500/day allowance.
  if(autoOn){ refresh(); timer = setInterval(refresh, 180000); }
};
$("gear").onclick = ()=>{
  $("oLat").value = CFG.from; $("dLat").value = CFG.to; $("arriveBy").value = CFG.arriveBy;
  $("setup").classList.toggle("open");
};
$("saveCfg").onclick = ()=>{
  const clean = v => v.replace(/\s+/g,"");
  if($("oLat").value.trim()) CFG.from = clean($("oLat").value);
  if($("dLat").value.trim()) CFG.to = clean($("dLat").value);
  CFG.arriveBy = $("arriveBy").value.trim();
  save(); $("setup").classList.remove("open"); refresh();
};

refresh();
</script>
</body>
</html>
