<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Train · Crystal City</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0B0D">
<style>
  :root{
    --chassis:#3B3733;      /* pylon brown-grey */
    --chassis-hi:#57514A;
    --board:#0A0B0D;        /* board face */
    --led:#FFB000;          /* amber PIDS */
    --led-dim:#5A3F0C;
    --led-soft:#B37C08;
    --blue:#0077C0;         /* Blue line */
    --go:#E8402A;
    --go-dim:#5A140C;
    --concrete:#B8B3AB;
    --ink:#E8E4DE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#15171A;
    color:var(--ink);
    font:400 13px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;align-items:flex-end;justify-content:flex-end;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;max-width:400px;height:100%;max-height:100vh;
    display:flex;flex-direction:column;
    background:var(--chassis);
    border-left:1px solid #000;
    overflow:hidden;position:relative;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:9px;
    padding:9px 12px;
    background:linear-gradient(180deg,var(--chassis-hi),var(--chassis));
    border-bottom:1px solid #221F1C;
    flex:0 0 auto;
  }
  .mark{
    width:22px;height:22px;border-radius:50%;
    background:var(--concrete);color:#2A2724;
    display:grid;place-items:center;
    font-weight:700;font-size:13px;letter-spacing:-.5px;
    flex:0 0 auto;
  }
  .where{flex:1;min-width:0}
  .where b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .where b i{font-style:normal;color:#8F8880;padding:0 3px}
  .where span{display:block;font-size:10.5px;color:#A49C93;margin-top:1px}
  .dot{width:7px;height:7px;border-radius:50%;background:#5A5450;flex:0 0 auto;
       transition:background .3s}
  .dot.on{background:#5FD08A;box-shadow:0 0 6px #5FD08A}
  .dot.err{background:var(--go);box-shadow:0 0 6px var(--go)}

  /* ---------- board ---------- */
  .board{
    background:var(--board);
    flex:1 1 auto;
    display:flex;flex-direction:column;
    position:relative;
    overflow:hidden;
    font-family:"DejaVu Sans Mono",Consolas,"Courier New",monospace;
  }
  .board::after{ /* dot-matrix scanline */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.75;
  }

  .cols{
    display:grid;grid-template-columns:34px 34px 1fr 46px;
    gap:6px;padding:7px 12px 4px;
    color:var(--led-soft);font-size:10px;letter-spacing:.14em;
    border-bottom:1px solid #1E1A12;
  }
  .cols i{font-style:normal}
  .cols i:last-child{text-align:right}

  #rows{padding:2px 0 4px}
  .row{
    display:grid;grid-template-columns:34px 34px 1fr 46px;
    gap:6px;align-items:center;
    padding:5px 12px;color:var(--led);font-size:14.5px;
    border-bottom:1px solid rgba(255,176,0,.07);
  }
  .row.past{color:var(--led-dim)}
  .row.target{background:rgba(255,176,0,.07)}
  .ln{
    display:grid;place-items:center;
    width:22px;height:18px;border-radius:2px;
    background:var(--blue);color:#fff;font-size:10px;font-weight:700;
    letter-spacing:.03em;
  }
  .row.past .ln{opacity:.35}
  .dest{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .min{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .empty{padding:22px 12px;color:var(--led-dim);font-size:12.5px;line-height:1.6}

  /* ---------- countdown: the loud part ---------- */
  .call{
    flex:0 0 auto;padding:12px 12px 14px;
    border-top:1px solid #1E1A12;
    background:#08090B;position:relative;
  }
  .call .lede{font-size:10px;letter-spacing:.16em;color:var(--led-soft);
    font-family:"Helvetica Neue",Arial,sans-serif}
  .big{
    display:flex;align-items:baseline;gap:8px;margin-top:2px;
    font-family:"DejaVu Sans Mono",Consolas,"Courier New",monospace;
  }
  .big em{
    font-style:normal;font-size:54px;line-height:.95;font-weight:700;
    color:var(--led);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .big small{font-size:12px;color:var(--led-soft);font-family:"Helvetica Neue",Arial,sans-serif}
  .sub{margin-top:4px;font-size:11.5px;color:#8A8078;
    font-family:"Helvetica Neue",Arial,sans-serif}

  /* alert states */
  #app.heads .call{background:#1A1206}
  #app.heads .big em{color:#FFD34D}
  #app.go{background:var(--go)}
  #app.go header{background:linear-gradient(180deg,#F0563F,var(--go));border-bottom-color:#8E1F12}
  #app.go .call{background:#2A0A05}
  #app.go .big em{color:#FF7A63}
  #app.go .lede{color:#FF9C88}
  #app.go{animation:beat 1s steps(1,end) infinite}
  @keyframes beat{0%,49%{box-shadow:inset 0 0 0 3px var(--go)}50%,100%{box-shadow:inset 0 0 0 3px transparent}}
  @media (prefers-reduced-motion:reduce){#app.go{animation:none;box-shadow:inset 0 0 0 3px var(--go)}}

  /* ---------- footer ---------- */
  footer{
    flex:0 0 auto;display:flex;gap:6px;align-items:center;
    padding:8px 10px;background:var(--chassis);
    border-top:1px solid #221F1C;
  }
  button{
    font:600 11.5px/1 "Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:#4A443E;border:1px solid #221F1C;
    border-radius:3px;padding:7px 10px;cursor:pointer;
  }
  button:hover{background:#585149}
  button:focus-visible{outline:2px solid var(--led);outline-offset:1px}
  button.primary{background:var(--blue);border-color:#005A93}
  button.primary:hover{background:#0089DB}
  button.quiet{background:transparent;color:#A49C93;padding:7px 6px}
  .spacer{flex:1}
  .clock{font:600 12px/1 "DejaVu Sans Mono",Consolas,monospace;color:#A49C93;
    font-variant-numeric:tabular-nums}

  /* ---------- settings ---------- */
  #settings{
    position:absolute;inset:0;background:#2E2B27;z-index:5;
    padding:14px;overflow:auto;display:none;
  }
  #settings.open{display:block}
  #settings h2{font-size:13px;font-weight:600;margin-bottom:12px}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .field label{flex:1;font-size:12px;color:#CFC8C0}
  .field input[type=number]{
    width:62px;background:#1B1917;color:var(--ink);border:1px solid #4A443E;
    border-radius:3px;padding:6px 7px;font:600 12px/1 monospace;text-align:right}
  .field input[type=time]{
    background:#1B1917;color:var(--ink);border:1px solid #4A443E;
    border-radius:3px;padding:5px 7px;font:600 12px/1 monospace}
  .field input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
  .hint{font-size:11px;color:#8A8078;line-height:1.5;margin:-5px 0 13px}
  .days{display:flex;gap:4px}
  .days button{padding:6px 0;width:30px;text-align:center;font-size:10.5px}
  .days button[aria-pressed=true]{background:var(--blue);border-color:#005A93}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark" aria-hidden="true">M</div>
    <div class="where">
      <b>Crystal City <i>→</i> Franconia&#8209;Spfld</b>
      <span id="statusline">Standby</span>
    </div>
    <div class="dot" id="dot" title="feed status"></div>
  </header>

  <div class="board">
    <div class="cols"><i>LN</i><i>CAR</i><i>DEST</i><i>MIN</i></div>
    <div id="rows"></div>
    <div class="empty" id="empty">Press <b>Start</b> to arm the board.<br>Departures appear from 2:30 PM on weekdays.</div>
  </div>

  <div class="call">
    <div class="lede" id="lede">LEAVE DESK IN</div>
    <div class="big"><em id="count">—</em><small id="countunit"></small></div>
    <div class="sub" id="sub">Not tracking yet.</div>
  </div>

  <footer>
    <button class="primary" id="startBtn">Start</button>
    <button id="testBtn">Test alert</button>
    <button class="quiet" id="demoBtn">Demo</button>
    <div class="spacer"></div>
    <span class="clock" id="clock">--:--</span>
    <button class="quiet" id="gearBtn" aria-label="Settings">⚙</button>
  </footer>

  <div id="settings">
    <h2>Commute settings</h2>
    <div class="field"><label for="walk">Walk to platform (min)</label><input type="number" id="walk" min="0" max="45" value="8"></div>
    <div class="field"><label for="buffer">Safety buffer (min)</label><input type="number" id="buffer" min="0" max="20" value="2"></div>
    <p class="hint">Countdown = train arrival − walk − buffer. At zero you get the full alert.</p>
    <div class="field"><label for="arm">Start watching at</label><input type="time" id="arm" value="14:30"></div>
    <div class="field"><label>Active days</label><div class="days" id="days"></div></div>
    <div class="field"><label for="snd">Chime on alert</label><input type="checkbox" id="snd" checked></div>
    <div class="field"><label for="vol">Chime volume</label><input type="number" id="vol" min="0" max="100" value="55"></div>
    <div class="field"><label for="notif">Windows notification</label><input type="checkbox" id="notif" checked></div>
    <div class="field"><label for="showall">Show all trains, not just Blue&nbsp;/&nbsp;Franconia</label><input type="checkbox" id="showall"></div>
    <div class="field"><label for="poll">Refresh every (sec)</label><input type="number" id="poll" min="10" max="120" value="20"></div>
    <button class="primary" id="closeGear" style="width:100%;padding:9px;margin-top:6px">Save and close</button>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Config + storage (storage is optional; falls back to memory)
 * ------------------------------------------------------------------ */
const DEFAULTS = {
  walk:8, buffer:2, arm:"14:30", days:[1,2,3,4,5],
  snd:true, vol:55, notif:true, showall:false, poll:20
};
let CFG = Object.assign({}, DEFAULTS);
const KEY = "metro-widget-cfg";
function loadCfg(){ try{ const r=localStorage.getItem(KEY); if(r) CFG=Object.assign({},DEFAULTS,JSON.parse(r)); }catch(e){} }
function saveCfg(){ try{ localStorage.setItem(KEY,JSON.stringify(CFG)); }catch(e){} }
loadCfg();

const STATION = "C09";               // Crystal City
const DEST_CODE = "J03";             // Franconia-Springfield
const LINE = "BL";
const API = "/api/trains";           // Cloudflare Pages Function proxy

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const S = {
  running:false, demo:false, trains:[], lastFetch:0, feedOk:null,
  errCount:0, nextTry:0, rateLimited:false, demoKey:false, errHint:"",
  lockEpoch:null,          // ms timestamp of the train we're tracking
  lockDest:"",
  headsFired:false, goFired:false, goUntil:0, muted:false
};
const $ = id => document.getElementById(id);
const app = $("app");

/* ------------------------------------------------------------------ *
 * Audio — synthesized, no files to load
 * ------------------------------------------------------------------ */
let actx=null;
function tone(freq,start,dur,gain){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="triangle"; o.frequency.value=freq;
  g.gain.setValueAtTime(0,actx.currentTime+start);
  g.gain.linearRampToValueAtTime(gain,actx.currentTime+start+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+start+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime+start); o.stop(actx.currentTime+start+dur+0.05);
}
function chime(kind){
  if(!CFG.snd || S.muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const v = Math.max(0,Math.min(100,CFG.vol))/100 * 0.5;
    if(kind==="heads"){ tone(784,0,.35,v*.7); tone(1046,.16,.4,v*.55); }
    else { // go: the door chime, three times, insistent
      for(let i=0;i<3;i++){ tone(1046,i*.42,.22,v); tone(784,i*.42+.13,.28,v*.85); }
    }
  }catch(e){}
}

/* ------------------------------------------------------------------ *
 * Notifications
 * ------------------------------------------------------------------ */
function notify(title,body){
  if(!CFG.notif) return;
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission==="granted"){ new Notification(title,{body,tag:"metro-go",renotify:true}); }
    else if(Notification.permission!=="denied"){ Notification.requestPermission(); }
  }catch(e){}
}

/* ------------------------------------------------------------------ *
 * Schedule window
 * ------------------------------------------------------------------ */
function inWindow(now){
  if(!CFG.days.includes(now.getDay())) return false;
  const [h,m] = CFG.arm.split(":").map(Number);
  const mins = now.getHours()*60+now.getMinutes();
  return mins >= h*60+m;
}

/* ------------------------------------------------------------------ *
 * Data
 * ------------------------------------------------------------------ */
function parseMin(v){
  if(v==null) return null;
  const s = String(v).trim().toUpperCase();
  if(s==="BRD") return 0;
  if(s==="ARR") return 0.5;
  if(s==="---"||s===""||s==="DLY") return null;
  const n = parseInt(s,10);
  return isNaN(n) ? null : n;
}

async function fetchTrains(){
  const now = Date.now();
  if(S.demo){ S.trains = demoTrains(now); S.feedOk = true; S.lastFetch = now; S.errCount = 0; return; }
  try{
    const r = await fetch(API + "?station=" + STATION, {cache:"no-store"});
    if(r.status === 429 || r.status === 403){ S.rateLimited = true; throw new Error("rate limited"); }
    if(r.status === 404){
      throw new Error("404 — the /api/trains function isn't deployed. On Cloudflare Pages the "
        + "functions/ folder must sit at the root of the repository, not inside a subfolder.");
    }
    if(!r.ok) throw new Error("HTTP " + r.status + " from the proxy");
    const j = await r.json();
    if(j.error) throw new Error("WMATA said: " + j.error);
    S.demoKey = !!j.usingDemoKey;
    S.trains = (j.Trains||[])
      .map(t=>({
        line:t.Line, car:t.Car, dest:t.DestinationName||t.Destination,
        destCode:t.DestinationCode, group:t.Group,
        min:parseMin(t.Min),
      }))
      .filter(t=>t.min!==null)
      // Pin each train to a wall-clock arrival the moment we hear about it.
      // If the feed then goes dark, the board keeps counting down honestly
      // instead of freezing trains at "8 minutes out" forever.
      .map(t=>({...t, epoch: now + t.min*60000}))
      .sort((a,b)=>a.epoch-b.epoch);
    S.feedOk = true; S.errCount = 0; S.rateLimited = false;
  }catch(e){
    S.feedOk = false; S.errCount++;
    S.errHint = (location.protocol === "file:")
      ? "Running from a local file, so there's no /api/trains to call. Deploy it, or use Demo."
      : e.message;
    // back off: 2x, 4x, 8x the base interval, capped at 5 minutes
    const wait = Math.min(CFG.poll*1000 * Math.pow(2, S.errCount), 300000);
    S.nextTry = now + wait;
    console.warn("feed error", e.message);
  }
  S.lastFetch = now;
}

function relevant(){
  const cut = Date.now() - 90000;
  const live = S.trains.filter(t=>t.epoch > cut);
  if(CFG.showall) return live;
  const f = live.filter(t=>t.line===LINE && t.destCode===DEST_CODE);
  return f.length ? f : live.filter(t=>t.line===LINE);
}

/* Demo generator: trains every 4-8 min, ticking down in real time */
let demoSeed=null;
function demoTrains(now){
  if(!demoSeed || demoSeed.filter(t=>t-now>0).length < 2){
    const keep = (demoSeed||[]).filter(t=>t-now>0);
    demoSeed = keep.slice();
    let t = keep.length ? keep[keep.length-1] : now + (2+Math.random()*3)*60000;
    while(demoSeed.length<5){ demoSeed.push(t); t += (4+Math.random()*4)*60000; }
    demoSeed.sort((a,b)=>a-b);
  }
  return demoSeed.filter(t=>t-now>-30000).map(t=>({
    line:"BL", car:"8", dest:"Franconia-Springfield", destCode:"J03", group:"1",
    min:(t-now)/60000, epoch:t
  })).sort((a,b)=>a.epoch-b.epoch);
}

/* ------------------------------------------------------------------ *
 * Target lock — keeps the countdown from jumping between trains
 * ------------------------------------------------------------------ */
function pickTarget(){
  const now = Date.now();
  const lead = (CFG.walk + CFG.buffer) * 60000;
  const cands = relevant();
  if(!cands.length){ S.lockEpoch=null; return null; }

  // keep the locked train if it's still in the feed and still catchable-ish
  if(S.lockEpoch){
    let best=null, bd=Infinity;
    for(const c of cands){ const d=Math.abs(c.epoch-S.lockEpoch); if(d<bd){bd=d;best=c;} }
    if(best && bd < 150000 && best.epoch - now > -60000){
      S.lockEpoch = best.epoch;
      return best;
    }
  }
  // otherwise take the soonest train you can still make
  const fresh = cands.find(c => c.epoch - now >= lead) || cands.find(c=>c.epoch-now>0);
  if(!fresh){ S.lockEpoch=null; return null; }
  S.lockEpoch = fresh.epoch; S.lockDest = fresh.dest;
  S.headsFired=false; S.goFired=false;
  return fresh;
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */
function fmtClock(d){ return d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
function pad2(n){ return (n<10?"0":"")+n; }

function render(){
  const now = new Date();
  $("clock").textContent = fmtClock(now);

  const dot = $("dot");
  dot.className = "dot" + (S.running ? (S.feedOk===false ? " err" : " on") : "");

  if(!S.running){
    $("statusline").textContent = S.demo ? "Demo stopped" : "Standby";
    return;
  }
  if(!S.demo && !inWindow(now)){
    const [h,m]=CFG.arm.split(":").map(Number);
    const t = new Date(); t.setHours(h,m,0,0);
    $("statusline").textContent = "Armed · watching from " + fmtClock(t);
    $("rows").innerHTML=""; $("empty").style.display="";
    $("empty").innerHTML = "Board wakes at <b>"+fmtClock(t)+"</b>.<br>Sitting quiet until then.";
    $("lede").textContent="LEAVE DESK IN";
    $("count").textContent="—"; $("countunit").textContent="";
    $("sub").textContent="Outside your watch window.";
    app.classList.remove("heads","go");
    return;
  }

  // board rows
  const list = relevant().slice(0,5);
  const rows = $("rows");
  const target = pickTarget();
  if(!list.length){
    rows.innerHTML=""; $("empty").style.display="";
    $("empty").innerHTML = S.feedOk===false
      ? (S.rateLimited
          ? "Shared demo key is rate limited right now. Retrying shortly &mdash; get your own key to stop this happening."
          : "No feed. " + (S.errHint || "Check the network, then press Start again."))
      : "No Blue Line trains reported right now.";
  } else {
    $("empty").style.display="none";
    rows.innerHTML = list.map(t=>{
      const out = (t.epoch - Date.now())/60000;          // minutes from right now
      const leaveIn = out - CFG.walk - CFG.buffer;
      const isT = target && Math.abs(t.epoch - S.lockEpoch) < 30000;
      const mm = out < 1 ? (out < 0.3 ? "BRD" : "ARR") : String(Math.floor(out));
      return `<div class="row ${leaveIn<0?"past":""} ${isT?"target":""}">
        <span class="ln">${t.line}</span>
        <span>${t.car||"—"}</span>
        <span class="dest">${t.dest}</span>
        <span class="min">${mm}</span>
      </div>`;
    }).join("");
  }

  const ageSec = Math.round((Date.now()-S.lastFetch)/1000);
  let feedNote;
  if(S.feedOk===false) feedNote = S.rateLimited ? "rate limited, retrying" : "feed down, retrying";
  else if(ageSec > 120) feedNote = "last data " + Math.round(ageSec/60) + " min old";
  else feedNote = "updated " + fmtClock(new Date(S.lastFetch));
  $("statusline").textContent = (S.demo ? "Demo · " : (S.demoKey ? "Demo key · " : "Live · ")) + feedNote;

  // countdown
  if(!target){
    $("count").textContent="—"; $("countunit").textContent="";
    $("sub").textContent="Nothing catchable on the board.";
    app.classList.remove("heads","go");
    return;
  }

  const msLeave = S.lockEpoch - Date.now() - (CFG.walk+CFG.buffer)*60000;
  const secs = Math.floor(msLeave/1000);
  const boardTime = new Date(S.lockEpoch);

  if(Date.now() < S.goUntil || secs <= 0){
    app.classList.remove("heads"); app.classList.add("go");
    $("lede").textContent = "GO NOW";
    $("count").textContent = "WALK";
    $("countunit").textContent = "";
    $("sub").textContent = "Train at " + fmtClock(boardTime) + " · " +
      CFG.walk + " min walk. Shut it down and move.";
    if(!S.goFired){
      S.goFired = true; S.goUntil = Date.now() + 120000;
      chime("go");
      notify("Leave now — "+fmtClock(boardTime)+" to Franconia-Springfield",
             CFG.walk+" minute walk. Close up shop.");
    }
  } else {
    app.classList.remove("go");
    const mins = Math.floor(secs/60), rem = secs%60;
    $("lede").textContent = "LEAVE DESK IN";
    $("count").textContent = mins + ":" + pad2(rem);
    $("countunit").textContent = "min";
    $("sub").textContent = "For the " + fmtClock(boardTime) + " train · " +
      CFG.walk + " min walk + " + CFG.buffer + " min buffer";
    if(secs <= 120){
      app.classList.add("heads");
      if(!S.headsFired){ S.headsFired=true; chime("heads");
        notify("Two minutes","Wrap up — "+fmtClock(boardTime)+" train to Franconia-Springfield."); }
    } else {
      app.classList.remove("heads");
    }
  }
}

/* ------------------------------------------------------------------ *
 * Loops
 * ------------------------------------------------------------------ */
setInterval(render, 1000);
// How often to ask WMATA. Slow when your train is far off, quick when the
// countdown is about to matter. Cuts daily calls by roughly two thirds
// versus a flat interval, which matters a lot on the shared demo key.
function pollInterval(){
  if(S.errCount > 0) return Math.max(0, S.nextTry - S.lastFetch);
  const base = CFG.poll*1000;
  if(!S.lockEpoch) return base*3;
  const toLeave = S.lockEpoch - Date.now() - (CFG.walk+CFG.buffer)*60000;
  if(toLeave < 5*60000)  return base;      // close: full rate
  if(toLeave < 15*60000) return base*2;    // mid
  return base*3;                            // far out
}

setInterval(async ()=>{
  if(!S.running) return;
  if(!S.demo && !inWindow(new Date())) return;
  if(Date.now() - S.lastFetch < pollInterval() - 500) return;
  await fetchTrains();
}, 1000);

/* ------------------------------------------------------------------ *
 * Controls
 * ------------------------------------------------------------------ */
function setRunning(on){
  S.running = on;
  $("startBtn").textContent = on ? "Stop" : "Start";
  $("startBtn").classList.toggle("primary", !on);
  if(on){
    S.headsFired=S.goFired=false; S.goUntil=0; S.lockEpoch=null;
    try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
    if(CFG.notif && "Notification" in window && Notification.permission==="default") Notification.requestPermission();
    fetchTrains();
  } else {
    app.classList.remove("heads","go");
  }
  render();
}
$("startBtn").onclick = ()=> setRunning(!S.running);

$("demoBtn").onclick = ()=>{
  S.demo = !S.demo; demoSeed=null; S.lockEpoch=null;
  S.headsFired=S.goFired=false; S.goUntil=0;
  $("demoBtn").style.color = S.demo ? "#FFB000" : "";
  if(S.demo && !S.running) setRunning(true); else render();
};

$("testBtn").onclick = ()=>{
  chime("go");
  notify("Leave now — test","This is what the real alert looks like.");
  app.classList.add("go");
  setTimeout(()=>{ if(!S.goFired) app.classList.remove("go"); }, 4000);
};

/* settings panel */
const dayNames=["Su","Mo","Tu","We","Th","Fr","Sa"];
const daysWrap=$("days");
dayNames.forEach((d,i)=>{
  const b=document.createElement("button");
  b.textContent=d; b.setAttribute("aria-pressed", CFG.days.includes(i));
  b.onclick=()=>{ const on=b.getAttribute("aria-pressed")==="true";
    b.setAttribute("aria-pressed",!on);
    CFG.days = on ? CFG.days.filter(x=>x!==i) : CFG.days.concat(i).sort(); };
  daysWrap.appendChild(b);
});
function fillGear(){
  $("walk").value=CFG.walk; $("buffer").value=CFG.buffer; $("arm").value=CFG.arm;
  $("snd").checked=CFG.snd; $("vol").value=CFG.vol; $("notif").checked=CFG.notif;
  $("showall").checked=CFG.showall; $("poll").value=CFG.poll;
}
$("gearBtn").onclick=()=>{ fillGear(); $("settings").classList.add("open"); };
$("closeGear").onclick=()=>{
  CFG.walk=+$("walk").value||0; CFG.buffer=+$("buffer").value||0; CFG.arm=$("arm").value||"14:30";
  CFG.snd=$("snd").checked; CFG.vol=+$("vol").value; CFG.notif=$("notif").checked;
  CFG.showall=$("showall").checked; CFG.poll=Math.max(10,+$("poll").value||20);
  saveCfg(); $("settings").classList.remove("open");
  S.lockEpoch=null; S.headsFired=S.goFired=false; render();
};

/* keyboard: space toggles, Esc dismisses an alert */
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ app.classList.remove("go","heads"); S.goUntil=0; }
});

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
render();
</script>
</body>
</html>
